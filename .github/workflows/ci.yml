name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: install, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (strict, 0 errors)
        run: bun run typecheck

      - name: Lint (0 warnings)
        run: bun run lint

      - name: Test (full suite incl. mock-provider E2E)
        run: bun test

  build-web:
    name: next build (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web GUI
        run: bun run --filter '@tagent-office/web' build
